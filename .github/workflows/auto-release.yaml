name: Auto release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Bump version and tag
    runs-on: ubuntu-22.04
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Determine next version
        id: next
        run: |
          current=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$current"
          next_patch=$((patch + 1))

          # Skip past any tags that already exist
          while git tag -l "v${major}.${minor}.${next_patch}" | grep -q .; do
            next_patch=$((next_patch + 1))
          done

          echo "version=${major}.${minor}.${next_patch}" >> "$GITHUB_OUTPUT"

      - name: Update package version
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      # The default-branch ruleset requires every change to land through a pull
      # request, so a direct push of the bump is rejected (this is what broke
      # releases between May and August). The bump rides its own PR instead,
      # squash-merged immediately: zero approvals are required, only the PR path.
      # The squash subject must keep the "chore: release v" prefix — it is what
      # the job-level guard matches to keep the merge push from re-triggering
      # this workflow into a release loop.
      - name: Land the version bump through a pull request
        id: bump
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          branch="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add package.json package-lock.json
          git commit -m "chore: release v${VERSION}"
          git push origin "$branch"
          pr_url=$(gh pr create --base main --head "$branch" \
            --title "chore: release v${VERSION}" \
            --body "Automated version bump for the v${VERSION} release.")
          gh pr merge "$pr_url" --squash --delete-branch \
            --subject "chore: release v${VERSION}" --body ""
          merge_sha=$(gh pr view "$pr_url" --json mergeCommit --jq .mergeCommit.oid)
          echo "merge_sha=${merge_sha}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release (creates the tag)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ steps.next.outputs.version }}
          MERGE_SHA: ${{ steps.bump.outputs.merge_sha }}
        run: |
          gh release create "v${VERSION}" \
            --target "$MERGE_SHA" \
            --title "v${VERSION}" \
            --generate-notes
